  <style>
    :root {
      --bg: #0d1a12;
      --card-bg: #132419;
      --ink: #f0fdf4;
      --muted: #86efac;
      --border: #a3e635;
      --primary: #84cc16;
      --accent-yellow-green: #ccff00;
      --card-alt: #1a3323;
      --correct-bg: #143820;
      --incorrect-bg: #381414;
      --incorrect-border: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink);
      background-color: var(--bg);
      background-image: 
        linear-gradient(to right, rgba(163, 230, 53, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(163, 230, 53, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 680px;
    }

    .journal-header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .journal-header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: -0.5px;
      color: var(--accent-yellow-green);
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0px var(--border);
      padding: clamp(24px, 5vw, 36px);
      position: relative;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      margin-bottom: 12px;
      color: var(--ink);
    }

    .description {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .rules {
      list-style: none;
      margin: 20px 0;
      border-top: 1px solid var(--card-alt);
    }

    .rules li {
      padding: 10px 0;
      border-bottom: 1px solid var(--card-alt);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rules li::before {
      content: "—";
      color: var(--accent-yellow-green);
      font-weight: bold;
    }

    .button {
      border: 2px solid var(--border);
      padding: 14px 20px;
      background: var(--card-alt);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s ease;
    }

    .button:hover {
      background: var(--accent-yellow-green);
      color: #0d1a12;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--border);
    }

    .button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }

    .button.full {
      width: 100%;
    }

    .btn-grid-level {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .btn-grid-grades {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-track {
      height: 6px;
      width: 100%;
      background: var(--card-alt);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: var(--accent-yellow-green);
      transition: width 0.2s ease;
    }

    .question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.2rem, 3.5vw, 1.5rem);
      line-height: 1.4;
      margin-bottom: 24px;
      color: var(--ink);
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      text-align: left;
      border: 1.5px solid var(--border);
      background: var(--card-alt);
      color: var(--ink);
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s ease;
    }

    .answer:hover:not(:disabled) {
      background: var(--accent-yellow-green);
      color: #0d1a12;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      background: var(--correct-bg) !important;
      border-color: var(--accent-yellow-green);
      color: var(--ink);
      font-weight: 600;
    }

    .answer.incorrect {
      background: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border);
      color: var(--ink);
      font-weight: 600;
    }

    .feedback {
      min-height: 24px;
      margin-top: 18px;
      font-size: 0.85rem;
      line-height: 1.5;
      padding: 10px 12px;
      border-left: 3px solid transparent;
    }

    .feedback.correct-text {
      background: var(--correct-bg);
      border-left-color: var(--accent-yellow-green);
      color: var(--ink);
    }

    .feedback.incorrect-text {
      background: var(--incorrect-bg);
      border-left-color: var(--incorrect-border);
      color: var(--ink);
    }

    .bottom-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .score {
      font-family: 'Playfair Display', serif;
      text-align: center;
      font-size: 3.5rem;
      font-weight: 800;
      margin: 12px 0;
      color: var(--accent-yellow-green);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .summary-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      padding: 12px 8px;
      text-align: center;
    }

    .summary-box strong {
      display: block;
      font-size: 1.3rem;
      margin-bottom: 2px;
      color: var(--accent-yellow-green);
    }

    .summary-box span {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }
      .card {
        padding: 20px 16px;
      }
      .btn-grid-level {
        grid-template-columns: 1fr;
      }
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="journal-header">
      <h1>Math & Science Week</h1>
    </header>

    <section class="card">
      <!-- 1. Welcome Screen -->
      <div id="welcome-screen" class="screen active">
        <h2>Math & Science Trivia</h2>

        <ul class="rules">
          <li>10 questions</li>
          <li>1 point per correct answer</li>
        </ul>

        <button id="start-button" class="button full">Begin Quiz</button>
      </div>

      <!-- 2. Level Selection Screen -->
      <div id="level-screen" class="screen">
        <h2>Select Level</h2>
        <p class="description">Choose your academic track:</p>

        <div class="btn-grid-level">
          <button id="btn-elem" class="button">Elem</button>
          <button id="btn-hs" class="button">High School</button>
        </div>
      </div>

      <!-- 3. Grade Selection Screen -->
      <div id="grade-screen" class="screen">
        <h2 id="grade-heading">Select Grade</h2>
        <p class="description">Pick your current grade level:</p>

        <div id="grade-options" class="btn-grid-grades"></div>
      </div>

      <!-- 4. Quiz Screen -->
      <div id="quiz-screen" class="screen">
        <div class="topline">
          <span id="grade-badge">Grade X</span>
          <span id="question-counter">Q 01 / 10</span>
        </div>

        <div class="progress-track" aria-label="Quiz progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <h2 id="question-text" class="question">
          Loading questions...
        </h2>

        <div id="answers-container" class="answers"></div>

        <div id="feedback" class="feedback" aria-live="polite"></div>

        <div class="bottom-row">
          <button id="next-button" class="button" hidden>
            Next Question →
          </button>
        </div>
      </div>

      <!-- 5. Result Screen -->
      <div id="result-screen" class="screen">
        <p id="result-grade-tag" class="description" style="text-align: center; margin-bottom: 0;"></p>
        <div id="score-display" class="score">0/10</div>
        <p id="result-message" class="description" style="text-align: center;"></p>

        <div class="summary">
          <div class="summary-box">
            <strong id="correct-count">0</strong>
            <span>Correct</span>
          </div>
          <div class="summary-box">
            <strong id="incorrect-count">0</strong>
            <span>Incorrect</span>
          </div>
          <div class="summary-box">
            <strong id="percentage">0%</strong>
            <span>Score</span>
          </div>
        </div>

        <button id="restart-button" class="button full">
          Retake Quiz
        </button>
      </div>
    </section>
  </main>

      const duration = 2.5 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#a3e635', '#84cc16', '#ccff00', '#ffffff']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#a3e635', '#84cc16', '#ccff00', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    // Utility: Fisher-Yates array randomizer
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;

            });
          });
        });
      }

      return data;

    const seedDataset = generateComprehensiveQuestionDataset();

    // Auto-seed Firestore
    async function seedFirestoreIfEmpty() {
      try {
        const testSnapshot = await getDocs(query(collection(db, "questions")));
        if (testSnapshot.empty) {
          console.log("Firestore 'questions' collection is empty. Uploading 360 unique questions...");
          for (const item of seedDataset) {
            await addDoc(collection(db, "questions"), item);
          }
          console.log("Firestore successfully populated!");
        }
      } catch (err) {
        console.error("Auto-seed error:", err);
      }
    }

    seedFirestoreIfEmpty();

    // Random Set selector (1 in 4 chance)
    function getRandomSetNumber() {
      return Math.floor(Math.random() * 4) + 1;
    }

    // Prepare question item with randomly shuffled answer options
    function prepareQuestionWithRandomOptions(rawItem) {
      const allOptions = [rawItem.correctAnswerText, ...rawItem.distractors];
      
      // Shuffle options array using Fisher-Yates
      shuffleArray(allOptions);

      const correctIndex = allOptions.indexOf(rawItem.correctAnswerText);

      return {
        id: rawItem.id || Math.random().toString(),
        grade: rawItem.grade,
        setNum: rawItem.setNum,
        question: rawItem.question,
        options: allOptions,
        correct: correctIndex,
        explanation: rawItem.explanation
      };
    }

    // Fetch questions for specific grade & random set
    async function getRandomQuestionsForGrade(gradeNum, chosenSetNum) {
      try {
        const q = query(
          collection(db, "questions"), 
          where("grade", "==", Number(gradeNum)),
          where("setNum", "==", Number(chosenSetNum))
        );
        
        const querySnapshot = await getDocs(q);
        let questionPool = [];

        querySnapshot.forEach((doc) => {
          questionPool.push({ id: doc.id, ...doc.data() });
        });

        // Fallback to local memory if Firestore query returns empty
        if (questionPool.length === 0) {
          questionPool = seedDataset.filter(q => q.grade === gradeNum && q.setNum === chosenSetNum);
        }

        // Prepare items and randomize option order
        const formattedQuestions = questionPool.map(item => prepareQuestionWithRandomOptions(item));

        // Randomize the order/placement of all questions every session
        return shuffleArray(formattedQuestions);
      } catch (error) {
        console.error("Error fetching questions from Firestore:", error);
        const fallbackPool = seedDataset.filter(q => q.grade === gradeNum && q.setNum === chosenSetNum);
        const formattedFallback = fallbackPool.map(item => prepareQuestionWithRandomOptions(item));
        return shuffleArray(formattedFallback);
      }
    }

    // State

    const resultMessage = document.getElementById("result-message");

    function showScreen(screenToShow) {
      [welcomeScreen, levelScreen, gradeScreen, quizScreen, resultScreen].forEach(screen => {
        screen.classList.remove("active");
      });
      screenToShow.classList.add("active");
    }

    document.getElementById("start-button").addEventListener("click", () => {
      showScreen(levelScreen);
    });

    document.getElementById("btn-elem").addEventListener("click", () => selectLevel('elem'));
    document.getElementById("btn-hs").addEventListener("click", () => selectLevel('hs'));

    function selectLevel(level) {
      selectedLevel = level;
      gradeOptions.innerHTML = "";

      let grades = [];
      if (level === 'elem') {
        gradeHeading.textContent = "Elementary Grades";
        grades = [
          { num: 1, label: "Grade 1" },
          { num: 2, label: "Grade 2" },
          { num: 3, label: "Grade 3" },
          { num: 4, label: "Grade 4" },
          { num: 5, label: "Grade 5" },
          { num: 6, label: "Grade 6" }
        ];
      } else {
        gradeHeading.textContent = "High School Grades";
        grades = [
          { num: 7, label: "Grade 7" },
          { num: 8, label: "Grade 8" },
          { num: 9, label: "Grade 9" }
        ];
      }

      grades.forEach(g => {
        const btn = document.createElement("button");
        btn.className = "button";
        btn.textContent = g.label;
        btn.onclick = () => startQuizForGrade(g.num, g.label);
        gradeOptions.appendChild(btn);
      });

      showScreen(gradeScreen);
    }

    async function startQuizForGrade(gradeNum, label) {
      selectedGrade = label;
      
      // Pick random question set (1-4) secretly
      activeSetNum = getRandomSetNumber();

      questionText.textContent = `Fetching questions...`;
      answersContainer.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      showScreen(quizScreen);

      // Query database & apply randomized question order + option shuffling
      currentQuestions = await getRandomQuestionsForGrade(gradeNum, activeSetNum);

      currentQuestion = 0;
      score = 0;
      answered = false;

      gradeBadge.textContent = `${selectedGrade}`;
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestion];

      answered = false;
      questionCounter.textContent = `Q ${String(currentQuestion + 1).padStart(2, '0')} / ${currentQuestions.length}`;
      progressBar.style.width = `${((currentQuestion + 1) / currentQuestions.length) * 100}%`;
      questionText.textContent = q.question;

      answersContainer.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.type = "button";
        btn.textContent = `${String.fromCharCode(65 + index)}. ${option}`;

        btn.addEventListener("click", () => {
          checkAnswer(index, btn);
        });

        answersContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (answered) return;

      answered = true;
      const q = currentQuestions[currentQuestion];
      const answerButtons = document.querySelectorAll(".answer");

      answerButtons.forEach(btn => {
        btn.disabled = true;
      });

      answerButtons[q.correct].classList.add("correct");

      if (selectedIndex === q.correct) {
        score++;
        selectedBtn.classList.add("correct");
        feedback.textContent = `Correct. ${q.explanation}`;
        feedback.classList.add("correct-text");
      } else {
        selectedBtn.classList.add("incorrect");
        feedback.textContent = `Incorrect. ${q.explanation}`;
        feedback.classList.add("incorrect-text");
      }

      nextButton.hidden = false;
      nextButton.textContent = (currentQuestion === currentQuestions.length - 1) ? "View Results →" : "Next Question →";
    }

    function nextQuestion() {
      if (!answered) return;

      currentQuestion++;
      if (currentQuestion < currentQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = currentQuestions.length;
      const incorrect = total - score;
      const pct = Math.round((score / total) * 100);

      resultGradeTag.textContent = `${selectedGrade}`;
      scoreDisplay.textContent = `${score}/${total}`;
      correctCount.textContent = score;
      incorrectCount.textContent = incorrect;
      percentage.textContent = `${pct}%`;

      if (pct === 100) {
        resultMessage.textContent = "Perfect score!";
        triggerConfetti();
      } else if (pct >= 70) {
        resultMessage.textContent = "Great job!";
        triggerConfetti();
      } else {
        resultMessage.textContent = "Keep practicing!";
      }

      showScreen(resultScreen);
    }

    nextButton.addEventListener("click", nextQuestion);
    document.getElementById("restart-button").addEventListener("click", () => {
      showScreen(welcomeScreen);
    });
